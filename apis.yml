description: Docebo is an AI-powered learning management system (LMS) platform providing a REST API for managing courses, users, learning plans,
  certifications, custom reports, gamification data, and e-commerce transactions. It serves enterprise and mid-market organizations with 250+
  learners across employee, customer, and partner training use cases.

